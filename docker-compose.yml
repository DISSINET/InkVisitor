# Basic setup runs out of the box with `docker compose up -d`.
# Override any value below via a top-level `.env` file or shell environment
# (e.g. `SECRET=... DOMAIN=... docker compose up -d`).
# Before exposing the instance publicly, at minimum set a strong SECRET.

x-logging: &logging
  logging:
    options:
      max-size: "10m"
      max-file: "2"

services:
  database:
    image: rethinkdb
    container_name: "inkvisitor-database"
    restart: always
    <<: *logging
    networks:
      - inkvisitor
    ports:
      - "8080:8080" # dashboard - required only for public access
      - "28015:28015" # driver port - required only for public access

  # PostgreSQL (TimescaleDB image) for the storage migration (#3256). Opt-in:
  # nothing reads it until the migration lands, RethinkDB stays the default.
  # Host port is overridable (PG_PORT=5433 docker compose up -d postgres).
  postgres:
    image: timescale/timescaledb:2.30.1-pg17
    container_name: "inkvisitor-postgres"
    restart: always
    <<: *logging
    environment:
      POSTGRES_DB: ${PG_NAME:-inkvisitor}
      POSTGRES_USER: ${PG_USER:-inkvisitor}
      POSTGRES_PASSWORD: ${PG_PASS:-inkvisitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - inkvisitor
    ports:
      - "${PG_PORT:-5432}:5432"

  inkvisitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: latest # client `.env` baked into the image; only used when building locally
    image: dissinet/inkvisitor:${IMAGE_TAG:-latest}
    container_name: inkvisitor
    restart: always
    <<: *logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Instance id — session cookie name (inkvisitor.sid.<ENV>). Must match client build mode.
      ENV: ${ENV:-production}
      DOMAIN: ${DOMAIN:-localhost}
      STATIC_PATH: ${STATIC_PATH:-/}
      PORT: ${PORT:-3000}
      # Database (DB_HOST is fixed to the compose service name)
      DB_HOST: database
      DB_PORT: ${DB_PORT:-28015}
      DB_NAME: ${DB_NAME:-inkvisitor}
      DB_AUTH: ${DB_AUTH:-}
      DB_POOL_CONNECTIONS: ${DB_POOL_CONNECTIONS:-10}
      # JWT signing secret — CHANGE THIS before exposing the instance
      SECRET: ${SECRET:-change-me-before-deploying}
      # SMTP (leave empty to disable outgoing mail)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_SECRET: ${SMTP_SECRET:-}
      MAILER_SENDER: ${MAILER_SENDER:-}
    ports:
      - "3000:3000"
    networks:
      - inkvisitor

networks:
  inkvisitor:

volumes:
  postgres-data:
