<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas dev</title>
  </head>
  <style>
    fieldset {
      margin: 0px;
    }
    .annotator-element {
      border: 1px solid black;
    }
  </style>
  <body style="background-color: black">
    <div style="padding: 20px; background-color: #ccc">
      <div style="display: flex; flex-direction: row">
        <div id="annotator-container" class="canvasses-wrapper">
          <div style="display: flex">
            <canvas
              id="lines"
              class="lines annotator-element"
              width="50px"
              height="400px"
              style="
                outline: none;
                color: rgb(21, 47, 46);
                background-color: yellowgreen;
              "
            ></canvas>
            <canvas
              tabindex="0"
              id="canvas"
              class="annotator-element"
              style="
                height: 400px;
                width: 100px;
                outline: none;
                background-color: white;
                border: 1px solid black;
                cursor: text;
              "
            >
            </canvas>
            <div
              class="scroller-viewport annotator-element"
              id="scroller"
              style="background: limegreen; position: relative; width: 14px"
            >
              <div
                class="scroller-cursor"
                style="
                  cursor: move;
                  position: absolute;
                  width: 10px;
                  background-color: white;
                  margin-left: 2px;
                "
              ></div>
            </div>
          </div>
        </div>
      </div>
      <fieldset>
        <label>search</label>
        <input type="text" id="search" />
        <button id="search-trigger">go</button>
        <button id="searchTriggerNext">next</button>
      </fieldset>
      <fieldset>
        <label>mode</label>
        <select id="mode">
          <option value="raw">raw</option>
          <option value="highlight" selected>highlight</option>
          <option value="semi">semi</option>
        </select>
      </fieldset>
      <fieldset>
        <label>toggle highlight</label>
        <input type="checkbox" id="highlightToggle" />
      </fieldset>
      <fieldset>
        <label>add anchor </label>
        <input type="text" id="anchorText" placeholder="Anchor name (e.g., person, location)" />
        <div style="margin-top: 5px;">
          <label>Attributes (key-value pairs):</label>
          <div id="attributeFields" style="margin-top: 5px;">
            <div class="attribute-row" style="margin-bottom: 5px;">
              <input type="text" placeholder="Key" class="attr-key" style="width: 100px; margin-right: 5px;" />
              <input type="text" placeholder="Value" class="attr-value" style="width: 100px; margin-right: 5px;" />
              <button type="button" class="remove-attr" style="background: #ff6b6b; color: white; border: none; padding: 2px 6px; cursor: pointer;">×</button>
            </div>
          </div>
          <button type="button" id="addAttribute" style="background: #4ecdc4; color: white; border: none; padding: 4px 8px; cursor: pointer; margin-top: 5px;">+ Add Attribute</button>
        </div>
        <button id="addAnchor" style="margin-top: 10px;">add</button>
      </fieldset>
      <fieldset>
        <label>remove anchor from selection </label>
        <input type="text" id="removeAnchorText" />
        <button id="removeAnchor">remove</button>
      </fieldset>
      <fieldset>
        <label>scroll to anchor </label>
        <input type="text" id="scrollToAnchorText" />
        <button id="scrollToAnchor">scroll</button>
      </fieldset>
      <fieldset>
        <label>update anchor </label>
        <input type="text" id="updateAnchorText" placeholder="Anchor name to update" />
        <div style="margin-top: 5px;">
          <label>New Attributes (key-value pairs):</label>
          <div id="updateAttributeFields" style="margin-top: 5px;">
            <div class="update-attribute-row" style="margin-bottom: 5px;">
              <input type="text" placeholder="Key" class="update-attr-key" style="width: 100px; margin-right: 5px;" />
              <input type="text" placeholder="Value" class="update-attr-value" style="width: 100px; margin-right: 5px;" />
              <button type="button" class="remove-update-attr" style="background: #ff6b6b; color: white; border: none; padding: 2px 6px; cursor: pointer;">×</button>
            </div>
          </div>
          <button type="button" id="addUpdateAttribute" style="background: #4ecdc4; color: white; border: none; padding: 4px 8px; cursor: pointer; margin-top: 5px;">+ Add Attribute</button>
        </div>
        <button id="updateAnchor" style="margin-top: 10px;">update</button>
      </fieldset>
      <fieldset>
        <label>update text</label>
        <textarea id="newText" cols="100" rows="10"></textarea>
        <button id="updateText">Update</button>
      </fieldset>
      <fieldset>
        <label>replace text</label>
        <input type="text" id="replaceText" placeholder="Text to replace selection" />
        <button id="replaceTextBtn">Replace</button>
      </fieldset>
      <fieldset>
        <label>resize</label>
        <button id="resizeBtn">Resize Annotator</button>
      </fieldset>
      <fieldset>
        <label>viewport position</label>
        <input type="checkbox" id="usePositionStorage" checked />
        <label for="usePositionStorage">store & restore position</label>
        <button id="collapseStoreBtn">Collapse & store position</button>
        <button id="restorePositionBtn">Restore</button>
      </fieldset>
    </div>

    <p>Text from textfile.txt:</p>
    <pre id="text-content"></pre>

    <script src="bundle.js"></script>

    <script type="module">
      const ratio = 2;
      const mainCanvasEl = document.getElementById("canvas");

      const textContentElement = document.getElementById("text-content");

      const exampleResponse = await fetch("example.txt");
      const exampleTxt = await exampleResponse.text();
      const searchInput = document.getElementById("search");
      const searchTriggerInput = document.getElementById("search-trigger");

      let highlightEnabled = false;
      const annotator = new Annotator(
        document.getElementById("canvas"),
        exampleTxt,
        ratio
      );

      annotator.setMode("highlight");

      annotator.fontColor = "black";
      annotator.bgColor = "transparent";

      annotator.setSelectStyle("turquoise", 0.6, "red");

      annotator.addScroller(document.getElementById("scroller"));
      annotator.addLines(document.getElementById("lines"));

      annotator.onHighlight((entityId) => {
        if (!highlightEnabled) {
          return null;
        }

        let color = "black";
        if (entityId[0] === "a") {
          color = "red";
        } else if (entityId[0] === "b") {
          color = "blue";
        } else if (entityId[0] === "c") {
          color = "green";
        } else if (entityId[0] === "d") {
          color = "yellow";
        }

        if (entityId.startsWith("T")) {
          return {
            mode: "underline",
            style: {
              color: color,
              opacity: 1,
            },
          };
        }

        if (entityId.endsWith("f")) {
          return {
            mode: "focus",
            style: {
              color: "#181C14",
              opacity: 0.65,
            },
          };
        }

        return {
          mode: "background",
          style: {
            color: color,
            opacity: 0.3,
          },
        };
      });

      annotator.onSelectText((text) => {
         console.log("onSelectText", text);
      });

      document.getElementById("highlightToggle").onclick = (e) => {
        highlightEnabled = e.target.checked;
        annotator.draw();
      };

      document.getElementById("mode").onchange = (e) => {
        annotator.setMode(e.target.value);
        annotator.draw();
      };

      // Function to add a new attribute row
      document.getElementById("addAttribute").onclick = () => {
        const attributeFields = document.getElementById("attributeFields");
        const newRow = document.createElement("div");
        newRow.className = "attribute-row";
        newRow.style.marginBottom = "5px";
        newRow.innerHTML = `
          <input type="text" placeholder="Key" class="attr-key" style="width: 100px; margin-right: 5px;" />
          <input type="text" placeholder="Value" class="attr-value" style="width: 100px; margin-right: 5px;" />
          <button type="button" class="remove-attr" style="background: #ff6b6b; color: white; border: none; padding: 2px 6px; cursor: pointer;">×</button>
        `;
        attributeFields.appendChild(newRow);
        
        // Add click handler for the remove button
        newRow.querySelector(".remove-attr").onclick = () => {
          newRow.remove();
        };
      };

      // Add click handlers for existing remove buttons
      document.querySelectorAll(".remove-attr").forEach(btn => {
        btn.onclick = () => {
          btn.parentElement.remove();
        };
      });

      // Function to collect attributes from the form
      function collectAttributes() {
        const attributes = {};
        document.querySelectorAll(".attribute-row").forEach(row => {
          const keyInput = row.querySelector(".attr-key");
          const valueInput = row.querySelector(".attr-value");
          if (keyInput.value.trim() && valueInput.value.trim()) {
            attributes[keyInput.value.trim()] = valueInput.value.trim();
          }
        });
        return Object.keys(attributes).length > 0 ? attributes : undefined;
      }

      document.getElementById("addAnchor").onclick = () => {
        const anchorText = document.getElementById("anchorText").value;
        const attributes = collectAttributes();
        annotator.addAnchor(anchorText, attributes);
      };

      document.getElementById("removeAnchor").onclick = () => {
        annotator.removeAnchorFromSelection(
          document.getElementById("removeAnchorText").value
        );
      };

      document.getElementById("scrollToAnchor").onclick = () => {
        annotator.scrollToAnchor(
          document.getElementById("scrollToAnchorText").value,
          0
        );
      };

      // Function to add a new attribute row for update anchor
      document.getElementById("addUpdateAttribute").onclick = () => {
        const updateAttributeFields = document.getElementById("updateAttributeFields");
        const newRow = document.createElement("div");
        newRow.className = "update-attribute-row";
        newRow.style.marginBottom = "5px";
        newRow.innerHTML = `
          <input type="text" placeholder="Key" class="update-attr-key" style="width: 100px; margin-right: 5px;" />
          <input type="text" placeholder="Value" class="update-attr-value" style="width: 100px; margin-right: 5px;" />
          <button type="button" class="remove-update-attr" style="background: #ff6b6b; color: white; border: none; padding: 2px 6px; cursor: pointer;">×</button>
        `;
        updateAttributeFields.appendChild(newRow);
        
        // Add click handler for the remove button
        newRow.querySelector(".remove-update-attr").onclick = () => {
          newRow.remove();
        };
      };

      // Add click handlers for existing remove buttons in update section
      document.querySelectorAll(".remove-update-attr").forEach(btn => {
        btn.onclick = () => {
          btn.parentElement.remove();
        };
      });

      // Function to collect attributes from the update form
      function collectUpdateAttributes() {
        const attributes = {};
        document.querySelectorAll(".update-attribute-row").forEach(row => {
          const keyInput = row.querySelector(".update-attr-key");
          const valueInput = row.querySelector(".update-attr-value");
          if (keyInput.value.trim() && valueInput.value.trim()) {
            attributes[keyInput.value.trim()] = valueInput.value.trim();
          }
        });
        return Object.keys(attributes).length > 0 ? attributes : undefined;
      }

      document.getElementById("updateAnchor").onclick = () => {
        const anchorName = document.getElementById("updateAnchorText").value;
        if (!anchorName) {
          alert("Please enter an anchor name to update");
          return;
        }

        const occurence = 1
        // Find the first occurrence of the anchor in the text
        const tagPositions = annotator.text.getTagPosition(anchorName, occurence);
        if (tagPositions.length < 2) {
          alert(`Anchor "${anchorName}" not found in the text`);
          return;
        }

        // Get the attributes from the form
        const newAttributes = collectUpdateAttributes();
        
        // Find the tag in the segments based on occurrence
        let targetTag = null;
        let currentOccurrence = 0;
        for (const segment of annotator.text.segments) {
          for (const tag of segment.openingTags) {
            if (tag.getTagName() === anchorName) {
              if (currentOccurrence === occurence) {
                targetTag = tag;
                break;
              }
              currentOccurrence++;
            }
          }
          if (targetTag) break;
        }

        if (!targetTag) {
          alert(`Opening tag for "${anchorName}" not found`);
          return;
        }

        // Call updateAnchor with the original tag and new attributes
        annotator.updateAnchor(targetTag, newAttributes);
      };

      document.getElementById("newText").onchange = () => {
        annotator.updateText(document.getElementById("newText").value);
      };

      document.getElementById("replaceTextBtn").onclick = () => {
        const replaceText = document.getElementById("replaceText").value;
        if (replaceText) {
          annotator.onReplaceText(replaceText);
        }
      };

      document.getElementById("resizeBtn").onclick = () => {
        annotator.resize();
      };

      let storedScrollPosition = null;
      let annotatorContainerParent = null;
      const annotatorContainer = document.getElementById("annotator-container");

      document.getElementById("collapseStoreBtn").onclick = () => {
        if (document.getElementById("usePositionStorage").checked) {
          storedScrollPosition = annotator.getViewportStartInRawText();
          console.log("Storing position:", storedScrollPosition);
        } else {
          storedScrollPosition = null;
          console.log("Position not stored (checkbox unchecked)");
        }
        annotatorContainerParent = annotatorContainer.parentNode;
        annotatorContainer.remove();
      };

      document.getElementById("restorePositionBtn").onclick = () => {
        if (annotatorContainerParent) {
          annotatorContainerParent.appendChild(annotatorContainer);
        }
        if (document.getElementById("usePositionStorage").checked && storedScrollPosition != null) {
          console.log("Loading position:", storedScrollPosition);
          annotator.scrollToRawPosition(storedScrollPosition);
        } else {
          console.log("Restoring to top (no position loaded)");
          annotator.scrollToLine(0);
        }
      };

      let searchOccurrence = 0;
      document.getElementById("searchTriggerNext").onclick = () => {
        const results = annotator.search(searchInput.value);
        if (results.length) {
          searchOccurrence = searchOccurrence + 1;

          if (searchOccurrence >= results.length) {
            searchOccurrence = 0;
          }

          annotator.selectSearchOccurrence(results[searchOccurrence]);
        }
      };

      searchTriggerInput.onclick = function () {
        const results = annotator.search(searchInput.value);
        if (results.length) {
          annotator.selectSearchOccurrence(results[0]);
        }
      };

      window.addEventListener("resize", resizeAnnotator);

      function resizeAnnotator() {
        const newW = document.body.clientWidth;
        const canvasW = `${newW - 50 - 40 - 10 - 11}px`;

        document.getElementById("canvas").style.width = canvasW;
      }

      resizeAnnotator();
    </script>
  </body>
</html>
